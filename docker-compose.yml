services:
  xrouter:
    image: ${XROUTER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xctr/xrouter:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xrouter
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "11016:11016"
    volumes:
      - ${XROUTER_CONFIG_PATH:-./config.yaml}:/xrouter/config.yaml
      - ${XROUTER_AUTH_PATH:-./auths}:/root/.xrouter
      - ${XROUTER_LOG_PATH:-./logs}:/xrouter/logs
      - ${XROUTER_PLUGIN_PATH:-./plugins}:/xrouter/plugins
    restart: unless-stopped
