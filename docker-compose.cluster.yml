services:
  xrouter:
    image: ${XROUTER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xctr/xrouter:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xrouter-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "11016:11016"
    volumes:
      - ${XROUTER_HOME_PATH:-./home}:/root/.xrouter
      - ${XROUTER_LOG_PATH:-./logs}:/xrouter/logs
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./xrouter -home-jwt "$$HOME_JWT"
      '
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
