services:
  xrouter:
    image: ${XROUTER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xctr/xrouter:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xrouter-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "11016:11016"
    volumes:
      - ${XROUTER_HOME_PATH:-./home}:/root/.xrouter
      - ${XROUTER_LOG_PATH:-./logs}:/xrouter/logs
      - ${XROUTER_PLUGIN_PATH:-./plugins}:/xrouter/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./xrouter -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
