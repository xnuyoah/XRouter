#         - name: "deepseek-v3.1"
#           alias: "claude-opus-4.66"
#         - name: "glm-5"
#           alias: "claude-opus-4.66"
#         - name: "kimi-k2.5"
#           alias: "claude-opus-4.66"

# END API KEY EXAMPLES

# OAuth/file-backed credentials. Token material stays in the credential store.
oauth:
  # Authentication directory (supports ~ for home directory)
  auth-dir: "~/.xrouter"

  # Core auth auto-refresh and manual refresh-all worker pool size (OAuth/file-based auth token refresh).
  # When > 0, overrides the default worker count (16).
  # auth-auto-refresh-workers: 16

  # Per-credential OAuth model name aliases are stored inside each OAuth auth JSON
  # file as "model_aliases". They rename model IDs for both model listing and request
  # routing, and apply only to that credential. Optional per-entry fields:
  #   fork: true                  # keep the upstream model and also expose the alias as a separate client-visible model
  #   display-name: "Model Name"  # override the human-readable name shown in model catalogs
  #   force-mapping: true         # rewrite upstream response model fields back to the client-visible alias

# Built-in image generation behavior.
multimedia:
  # disable-image-generation supports: false (default), true, "chat", or "passthrough".
  # - true: disable image_generation everywhere (also returns 404 for /v1/images/generations and /v1/images/edits).
  # - "chat": disable image_generation injection on non-images endpoints, but keep /v1/images/generations and /v1/images/edits enabled.
  # - "passthrough": never inject or strip image_generation on non-images endpoints (forward the client payload unchanged); behaves like "chat" on /v1/images/* endpoints.
  disable-image-generation: false

# Application logs, request logs, usage aggregation, and profiling.
observability:
  logs:
    # Enable debug logging
    debug: false

    # When true, write application logs to rotating files instead of stdout
    logging-to-file: false

    # Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
    # files are deleted until within the limit. Set to 0 to disable.
    logs-max-total-size-mb: 0

    # Maximum number of error log files retained when request logging is disabled.
    # When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
    error-logs-max-files: 10

    # Record proxy request/response logs. Management requests are excluded.
    request-log: false

  usage:
    # When false, disable in-memory usage statistics aggregation
    usage-statistics-enabled: false

    # How long (in seconds) usage queue items are retained in memory for the Management API.
    # The local Redis RESP usage output is disabled.
    # Default: 60. Max: 3600.
    redis-usage-queue-retention-seconds: 60

    # Native LLM/search usage analytics shown under Observe -> Usage Analytics.
    # This is independent of usage-statistics-enabled (which controls the Redis queue).
    # Requires a restart after enabling or disabling.
    analytics:
      enabled: false
      # Database path. Empty uses WRITABLE_PATH/usage-analytics/usage.db,
      # then the config directory, then the working directory.
      db: ""
      # Per-request detail retention in days (1..3650).
      retention-days: 90
      # Minute-rollup retention in days (1..3650).
      rollup-retention-days: 365
      # Batch write interval (1s..1h). Empty writes every request.
      flush-interval: 5s
      # Soft logical data cap in bytes. When exceeded, the oldest events and
      # rollups are pruned. 0 disables the cap.
      max-db-bytes: 0
      # Fill blank plan/quota labels in LLM usage records. This is display-only
      # and never changes routing or upstream quotas. An entry with an empty
      # model applies to every model served by the provider; a model entry
      # matches the model, upstream model, or alias. Existing upstream plan
      # values are never overwritten. Restart after changing this mapping.
      plan-display:
        - provider: "nvidia"
          plan: "NIM Free"
          quota-kind: "credits"
        - provider: "agnes"
          plan: "Agnes Free"
          quota-kind: "plan"
      # Reference model prices are synced from a models.dev-compatible catalog.
      # Manual overrides are managed from Observe -> Usage Analytics -> Prices.
      pricing:
        sync-enabled: false
        source-url: "https://models.dev/api.json"
        provider-priority: [openai, google, anthropic]
        ignored-suffixes: ["-thinking", "-preview", "-high", "-low", "(thinking)", "(xhigh)", "(high)", "(medium)", "(low)", "(max)", "(auto)", "(none)"]
        currency: "USD"

  # Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
  pprof:
    enable: false
    addr: "127.0.0.1:8316"

# Standard dynamic library plugins are trusted in-process code. They are disabled by default.
# Build Go examples with go build -buildmode=c-shared for the target GOOS/GOARCH.
# Other languages can implement the same C ABI and JSON method protocol.
# Plugin executors require a matching auth record with the same provider key.
# If the same provider is configured as OpenAI-compatible, the native executor wins.
# 搜索渠道（tavily / exa / anysearch / firecrawl / tinyfish）。
# 这些渠道不提供对话模型，只做搜索/抓取类 HTTP 透传；客户端使用 access.api-keys
# 中的密钥访问 /gateway/<channel>/... 与 /mcp/<channel>，无需额外申请渠道密钥。
# 启用规则：只要声明了至少一个渠道即视为开启；删掉全部渠道或把 disabled 设为 true
# 即关闭整个子系统（客户端路由、MCP 镜像、测活与管理接口一起关闭）。
web-search:
# 显式关闭整个子系统；留空且声明了渠道时即为开启。
  disabled: false
# 探测（测活 / 渠道状态 / 额度刷新）使用的出站代理，支持 http、https、socks5、socks5h。
# 为空时回退到顶层 requests.proxy-url；两者都为空时探测直接失败，绝不回退直连。
  proxy-url: ""
  gateway:
# 单次请求最多尝试的账号数（额度不足 / 鉴权失效 / 限流时自动换号）。
    max-attempts: 3
  probe:
# 定时任务间隔（秒）：渠道状态检测 + 额度刷新。
    interval-seconds: 1200
# 探测并发上限。
    concurrency: 4
# 单次探测请求超时（秒）。
    timeout-seconds: 20
# 渠道状态历史保留天数。
    history-days: 90
  quota:
# 额度快照被视为“新鲜”的时长（秒）；到期后会被定时任务重新拉取。
    fresh-seconds: 900
  channels:
    - id: tavily
      name: Tavily
      # 停用该渠道；停用后客户端请求返回 503，探测也会跳过。
      disabled: false
      # 可选：覆盖默认上游主机（用于自建代理或灰度环境），填写时不含路径。
      # base-url: "https://api.tavily.com"
      # 可选：覆盖本渠道的出站代理，留空继承上面的 web-search.proxy-url。
      # proxy-url: "socks5://127.0.0.1:1080"
      accounts:
        - name: "tavily-1"
          # 上游服务商密钥。Tavily 会按 key / plan / paygo 三个维度返回用量。
          api-key: "tvly-your-key"
          weight: 1
          # 可选：停用该账号（不参与选号与探测）。
          # disabled: false
          # note: "预留"
    - id: exa
      name: Exa
      accounts:
        - name: "exa-1"
          api-key: "your-exa-key"
    - id: anysearch
      name: AnySearch
      accounts:
        - name: "anysearch-1"
          api-key: "your-anysearch-key"
          # AnySearch 的 API key 探测端点不返回余额；填写网页登录账号密码后，
          # 测活会额外登录控制台读取余额（登录/查询失败不影响鉴权结论）。
          username: "your-login-id"
          password: "your-password"
    - id: firecrawl
      name: Firecrawl
      accounts:
        - name: "firecrawl-1"
          # Firecrawl 在账号透支时会返回负的 remainingCredits：面板按原值展示，
          # 选号时按 0 处理（视为已耗尽）。
          api-key: "fc-your-key"
    - id: tinyfish
      name: Tinyfish
      accounts:
        - name: "tinyfish-1"
          api-key: "your-tinyfish-key"

# Legacy compatibility reference (comments only; not part of this v8 template).
# Old files and /v0/management still work without a v8 write. Existing legacy-only
# fields remain in their old locations until a successful v8 configuration write.
# When manually mixing layouts, a present new field wins over its legacy equivalent.
# To deliberately use an old field again, remove its corresponding new field first.
# Client keys moved from the old api-keys list to access.api-keys; the new root
# api-keys is reserved for provider groups. These cannot share one YAML key.
#
# Old spellings shown for reference:
#   host: ""                         # now server.host
#   port: 11016                       # now server.port
#   remote-management:               # now management
#     allow-remote: false
#     secret-key: ""
#   api-keys: ["your-api-key-1"]      # now access.api-keys
#   request-retry: 3                 # now routing.retry.request-retry
#   debug: false                     # now observability.logs.debug
#   proxy-url: ""                    # now requests.proxy-url
#   auth-dir: "~/.xrouter"     # now oauth.auth-dir
#
# Compatibility-only quota switches have no new v8 counterpart. They remain
# readable/editable in legacy files and through /v0/management, but are omitted
# from the active v8 template:
#   quota-exceeded:
#     switch-project: true
#     switch-preview-model: true
